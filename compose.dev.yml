services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pousada_dev
      POSTGRES_USER: pousada_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pousada_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousada_dev -d pousada_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pousada_dev_data:
