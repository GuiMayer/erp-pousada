services:
  proxy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN com o domínio público}
    ports: ["80:80", "443:443"]
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
