services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pousada-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DATA_ADAPTER: database
      DATABASE_URL: postgresql://pousada:pousada@postgres:5432/pousada
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
      - ./backups:/app/backups

  postgres:
    image: postgres:16-alpine
    container_name: pousada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: pousada
    ports:
      - "5432:5432"
    volumes:
      - pousada_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousada -d pousada"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup-worker:
    image: postgres:16-alpine
    container_name: pousada-backup-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: pousada
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_MINUTES: 30
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/backup-worker.sh"]

volumes:
  pousada_postgres_data:
