services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_DATA_ADAPTER: database
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://pousada:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/pousada
      APP_URL: ${APP_URL:?Defina APP_URL com a URL HTTPS}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - pousada_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousada -d pousada"]
      interval: 10s
      timeout: 5s
      retries: 5
  backup-worker:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/backup-worker.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last-success && find /backups/last-success -mmin -$${BACKUP_INTERVAL_MINUTES} | grep -q ."]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  pousada_postgres_data:
