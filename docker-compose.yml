name: erp-pousada
services:
  app:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: erp-pousada:${APP_VERSION:-local}
    build:
      context: .
      args:
        NEXT_PUBLIC_DATA_ADAPTER: database
    restart: unless-stopped
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://pousada_app:${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD}@postgres:5432/pousada
      APP_URL: ${APP_URL:-https://localhost}
      SYNC_EVENTS_ENABLED: ${SYNC_EVENTS_ENABLED:-true}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Defina DB_ADMIN_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Defina DB_MIGRATOR_PASSWORD}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?Defina DB_BACKUP_PASSWORD}
    volumes:
      - pousada_postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./scripts/db-roles.sql:/scripts/db-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousada_admin -d pousada"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: erp-pousada:${APP_VERSION:-local}
    build:
      context: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pousada_migrator:${DB_MIGRATOR_PASSWORD:?Defina DB_MIGRATOR_PASSWORD}@postgres:5432/pousada
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
  database-permissions:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: postgres:16.15-alpine
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${DB_ADMIN_PASSWORD:?Defina DB_ADMIN_PASSWORD}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?Defina DB_WORKER_PASSWORD}
    volumes:
      - ./scripts/db-runtime-grants.sql:/scripts/db-runtime-grants.sql:ro
      - ./scripts/db-configure-permissions.sh:/scripts/db-configure-permissions.sh:ro
    command: ["sh", "/scripts/db-configure-permissions.sh"]
  notification-worker:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: erp-pousada:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pousada_notifications:${DB_WORKER_PASSWORD:?Defina DB_WORKER_PASSWORD}@postgres:5432/pousada
    command: ["./node_modules/.bin/tsx", "scripts/notification-worker.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(fs.existsSync('/tmp/notification-worker-success') && Date.now()-Number(fs.readFileSync('/tmp/notification-worker-success','utf8'))<180000?0:1)"]
      interval: 60s
      start_period: 60s
      timeout: 5s
      retries: 3
  backup-worker:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada_backup
      POSTGRES_PASSWORD: ${DB_BACKUP_PASSWORD:?Defina DB_BACKUP_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG: /backup-config/rclone.conf
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ${BACKUP_CONFIG_DIR:-./.local/backup-config}:/backup-config:ro
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/backup-worker.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last-success && find /backups/last-success -mmin -$${BACKUP_INTERVAL_MINUTES} | grep -q . && test ! -f /backups/last-error"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
  restore:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: postgres:16.15-alpine
    profiles: [maintenance]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada_migrator
      POSTGRES_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Defina DB_MIGRATOR_PASSWORD}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/db-restore.sh"]
volumes:
  pousada_postgres_data:
