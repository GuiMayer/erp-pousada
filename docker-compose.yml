services:
  postgres:
    image: postgres:16-alpine
    container_name: pousada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pousada_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pousada_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pousada_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pousada_postgres_data:
